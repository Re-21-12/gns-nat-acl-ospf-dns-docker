<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Intranet Local</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      padding: 48px 64px;
      text-align: center;
      max-width: 480px;
    }
    .badge {
      display: inline-block;
      background: #0f3460;
      color: #00d4ff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 20px;
    }
    h1 { color: #e94560; font-size: 28px; margin-bottom: 12px; }
    p  { color: #a0a0b0; line-height: 1.6; margin-top: 8px; }
    .info {
      margin-top: 24px;
      background: #0f3460;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 13px;
      color: #7ec8e3;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">dominio.local</div>
    <h1>Bienvenido a la Intranet</h1>
    <p>Este sitio es exclusivo para usuarios de <strong>LAN1</strong>.</p>
    <p>Acceso restringido · Solo red interna</p>
    <div class="info">10.1.0.11 · fd00:1::11</div>
  </div>
</body>
</html>
